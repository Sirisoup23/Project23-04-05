<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Slot Machine</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #000000;
        }

        h1 {
            margin-bottom: 20px;
            color: #000000;
        }

        /* 3-slot layout */
        .slot-machine {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .slot {
            width: 100px;
            height: 100px;
            background: transparent;
            border: 4px solid #f1c40f;
            border-radius: 10px;
            font-size: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        button {
            background-color: #e74c3c;
            color: #ffffff;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px #c0392b;
            transition: all 0.1s ease;
        }

        button:active {
            box-shadow: 0 0px #c0392b;
            transform: translateY(5px);
        }

        button:disabled {
            background-color: #7f8c8d;
            box-shadow: 0 5px #95a5a6;
            cursor: not-allowed;
        }

        .result {
            margin-top: 25px;
            font-size: 24px;
            font-weight: bold;
            min-height: 35px;
            color: #000000;
        }
    </style>
</head>
<body>

    <h1>🎰 LUCKY SLOT 🎰</h1>
    
    <!-- Slot machine display reels -->
    <div class="slot-machine">
        <div id="slot1" class="slot">🍒</div>
        <div id="slot2" class="slot">🍋</div>
        <div id="slot3" class="slot">🍇</div>
    </div>

    <!-- Spin button -->
    <button id="spinBtn">SPIN!</button>

    <!-- Win/Loss result message display area -->
    <div id="resultMessage" class="result"></div>

<script>
    // Array of symbols used in the Slot Machine
    const symbols = ['🍒', '🍋', '🍇', '🍉', '🔔', '💎', '7️⃣'];

    // Attach event listener to the spin button
    document.getElementById('spinBtn').addEventListener('click', spin);

    function spin() {
        const slot1 = document.getElementById('slot1');
        const slot2 = document.getElementById('slot2');
        const slot3 = document.getElementById('slot3');
        const resultMessage = document.getElementById('resultMessage');

        // Reset previous result state
        resultMessage.innerText = "";

        // Generate instant random symbols for all 3 slots
        const res1 = getRandomSymbol();
        const res2 = getRandomSymbol();
        const res3 = getRandomSymbol();

        // Immediately update display
        slot1.innerText = res1;
        slot2.innerText = res2;
        slot3.innerText = res3;

        // Check winning condition: match all 3 slots
        if (res1 === res2 && res2 === res3) {
            resultMessage.innerText = `🎉 Jackpot! You Won! (${res1}${res2}${res3}) 🎉`;
        } else {
            resultMessage.innerText = "❌ Bad luck! Try again! ❌";
        }
    }

    // Utility function to get a random symbol from the array
    function getRandomSymbol() {
        const randomIndex = Math.floor(Math.random() * symbols.length);
        return symbols[randomIndex];
    }
</script>

</body>
</html>
