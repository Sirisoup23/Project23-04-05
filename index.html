<script>
    // อาร์เรย์เก็บรายการสัญลักษณ์ที่ใช้ใน Slot Machine
    const symbols = ['🍒', '🍋', '🍇', '🍉', '🔔', '💎', '7️⃣'];

    function spin() {
        const slot1 = document.getElementById('slot1');
        const slot2 = document.getElementById('slot2');
        const slot3 = document.getElementById('slot3');
        const spinBtn = document.getElementById('spinBtn');
        const resultMessage = document.getElementById('resultMessage');

        // ปิดการใช้งานปุ่มชั่วคราว และล้างข้อความผลลัพธ์เดิม
        spinBtn.disabled = true;
        resultMessage.innerText = "";
        resultMessage.className = "result";

        // ใส่แอนิเมชันเคลื่อนไหวเพิ่มความสมจริง
        slot1.classList.add('spinning');
        slot2.classList.add('spinning');
        slot3.classList.add('spinning');

        // จำลองเวลาในการหมุน (1 วินาที) ก่อนจะหยุดและสุ่มผลลัพธ์
        setTimeout(() => {
            // ถอดแอนิเมชันออกเมื่อหยุดหมุน
            slot1.classList.remove('spinning');
            slot2.classList.remove('spinning');
            slot3.classList.remove('spinning');

            // สุ่มสัญลักษณ์ให้ทั้ง 3 ช่อง
            const res1 = getRandomSymbol();
            const res2 = getRandomSymbol();
            const res3 = getRandomSymbol();

            // แสดงผลลัพธ์บนหน้าจอ
            slot1.innerText = res1;
            slot2.innerText = res2;
            slot3.innerText = res3;

            // ตรวจสอบเงื่อนไขการชนะรางวัล: ถ้าทั้ง 3 ช่องซ้ำกันทั้งหมด
            if (res1 === res2 && res2 === res3) {
                resultMessage.innerText = `🎉 คุณชนะรางวัลแจ็กพอต! (${res1}${res2}${res3}) 🎉`;
                resultMessage.classList.add('win');
            } else {
                resultMessage.innerText = "❌ เสียใจด้วยนะ! ลองใหม่อีกครั้ง ❌";
                resultMessage.classList.add('lose');
            }

            // เปิดใช้งานปุ่มกดอีกครั้ง
            spinBtn.disabled = false;
        }, 1000); 
    }

    // ฟังก์ชันช่วยสุ่มดึงสัญลักษณ์จากอาร์เรย์อย่างยุติธรรม
    function getRandomSymbol() {
        const randomIndex = Math.floor(Math.random() * symbols.length);
        return symbols[randomIndex];
    }
</script>

</body>
</html>
